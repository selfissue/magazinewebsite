<style>
  :root{
    --paper:#F2DE72;
    --paper-hi:#F6E585;
    --ink:#1B1A17;
    --ink-soft:#6A6550;
    --line:rgba(27,26,23,.20);
    --disp:"Fraunces","Iowan Old Style",Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,"Courier New",monospace;
    --edge:clamp(22px,6vw,56px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100dvh;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% 8%, var(--paper-hi), var(--paper) 62%);
    color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased;
  }
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px var(--edge) 64px;
  }
  h1{
    margin:0;font-weight:300;line-height:1;letter-spacing:-.02em;white-space:nowrap;
    font-size:clamp(38px,10vw,104px);
  }
  h1{color:#FFFFFF}
  h1 .paren{display:inline-block;color:#FFFFFF;opacity:.55;font-weight:300;transform:translateY(-.02em)}
  h1 .self{font-style:italic;font-weight:400}
  .dek{
    margin:clamp(22px,4vw,34px) 0 0;max-width:30ch;
    font-size:clamp(16px,2.2vw,19px);line-height:1.55;color:var(--ink-soft);
  }
  form{margin-top:clamp(30px,5vw,44px);width:min(400px,86vw)}
  .row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);transition:border-color .25s}
  .row:focus-within{border-color:var(--ink)}
  input[type=email]{
    flex:1;min-width:0;border:0;background:transparent;
    font-family:var(--disp);font-size:clamp(17px,2.4vw,19px);color:var(--ink);padding:13px 2px;outline:none;
  }
  input[type=email]::placeholder{color:rgba(27,26,23,.38)}
  .row button{
    border:0;background:transparent;cursor:pointer;color:var(--ink);
    font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    padding:0 2px 0 16px;display:flex;align-items:center;gap:8px;transition:opacity .2s;
  }
  .row button .arr{transition:transform .25s}
  .row button:hover .arr{transform:translateX(4px)}
  .row button:disabled{opacity:.5;cursor:default}
  .soon{margin-top:clamp(30px,5vw,44px);font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
  label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .status{margin-top:16px;min-height:1.3em;font-size:15px;line-height:1.4;font-style:italic;color:var(--ink-soft)}
  .status.err{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:#7a2016}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .fade{opacity:0;transform:translateY(8px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .fade.d1{animation-delay:.05s}.fade.d2{animation-delay:.18s}.fade.d3{animation-delay:.32s}.fade.d4{animation-delay:.46s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.fade{opacity:1;transform:none}}
</style>
</head>
<body>

  <main>
    <h1 class="fade d1">the <span class="paren">(</span><span class="self">self</span><span class="paren">)</span> issue</h1>
    <p class="dek fade d2">Join the waitlist. Be first to know.</p>

    <p class="soon fade d3">Coming soon</p>
  </main>

</body>
</html>
